name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test, build and lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Engine tests
        run: npm test
      - name: MIDI converter tests (Python, evaluated in TidalJS with Node)
        run: python3 tool/tests/test_midi2tidal.py -v
        env:
          MIDI2TIDAL_REQUIRE_NODE: "1"
      - name: Type-check and build
        run: npm run build
      - name: SibuJS lint
        run: npm run lint

  browser:
    name: Browser integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
